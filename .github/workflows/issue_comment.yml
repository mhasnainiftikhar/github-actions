name: Create issue comment workflow

on:
  issues:
    types: [opened]

jobs:
  comment-with-action:
    runs-on: ubuntu-latest
    steps:
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: |
          echo "github context:"
          printf '%s\n' "$GITHUB_CONTEXT"
        shell: bash
