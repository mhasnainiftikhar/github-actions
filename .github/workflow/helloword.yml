name:hello word workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
   hello:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v3
        - name: hello word
          run: echo "hello word"
          shell: bash

    goodbye:
     runs-on: ubuntu-latest
     steps:
        - uses: actions/checkout@v3
          - name: goodbye word
            run: echo "goodbye word"
            shell: bash